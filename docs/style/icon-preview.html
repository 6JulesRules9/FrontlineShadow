<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontline Shadow — Icon-Vorschau v0.1</title>
<style>
  :root{
    --bg-base:#0E0F11; --bg-panel:#15171A; --bg-panel-2:#1D2024;
    --ink:#E8EAED; --ink-muted:#8A9099; --ink-dim:#565B62;
    --accent:#62D2E0; --danger:#E0556A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-base);color:var(--ink);
    font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding:40px}
  h1{font-weight:700;letter-spacing:.04em;font-size:22px;margin:0 0 4px}
  .sub{color:var(--ink-muted);margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px;max-width:920px}
  .card{background:var(--bg-panel);border:1px solid #23262b;border-radius:14px;
    padding:18px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .card .ico{width:96px;height:96px}
  .name{font-weight:600;letter-spacing:.03em}
  .slot{color:var(--ink-muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .row2{margin-top:34px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0}
  .sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink-muted)}
  .chip{width:54px;height:34px;border-radius:8px;border:1px solid #2a2d33}
  .lbl{margin:32px 0 10px;color:var(--ink-muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .active .ico{filter:drop-shadow(0 0 6px rgba(98,210,224,.55))}
</style>
</head>
<body>
  <h1>FRONTLINE SHADOW — Komponenten-Icons <span style="color:var(--accent)">v0.1</span></h1>
  <p class="sub">Konsistenz-Test des Style-Token-Systems · 256² SVG · Line-Icons · ein Akzent-Detail pro Icon</p>

  <div class="lbl">Komponenten</div>
  <div class="grid" id="grid"></div>

  <div class="lbl row2">Aktiv-Zustand (Akzent-Glow)</div>
  <div class="grid" id="gridActive"></div>

  <div class="lbl">Farb-Tokens</div>
  <div class="swatches" id="sw"></div>

<script>
const icons = {
  Ketten:`<svg viewBox="0 0 256 256" fill="none" stroke="#E8EAED" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"><rect x="34" y="92" width="188" height="80" rx="40"/><rect x="60" y="116" width="136" height="32" rx="16" stroke="#8A9099" stroke-width="7"/><circle cx="84" cy="150" r="13"/><circle cx="122" cy="150" r="13"/><circle cx="160" cy="150" r="13"/><circle cx="196" cy="118" r="12" stroke="#62D2E0"/></svg>`,
  Core:`<svg viewBox="0 0 256 256" fill="none" stroke="#E8EAED" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"><polygon points="128,38 208,84 208,172 128,218 48,172 48,84"/><polygon points="128,86 168,109 168,147 128,170 88,147 88,109" stroke="#8A9099" stroke-width="7"/><circle cx="128" cy="128" r="13" fill="#62D2E0" stroke="none"/></svg>`,
  Turm:`<svg viewBox="0 0 256 256" fill="none" stroke="#E8EAED" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"><circle cx="128" cy="150" r="58"/><rect x="106" y="104" width="44" height="74" rx="18"/><rect x="118" y="58" width="20" height="56" rx="8"/><path d="M196 120 A74 74 0 0 0 78 84" stroke="#62D2E0" stroke-width="7"/><path d="M78 84 l-2 18 18 -6" stroke="#62D2E0" stroke-width="7"/></svg>`,
  "Geschütz":`<svg viewBox="0 0 256 256" fill="none" stroke="#E8EAED" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"><g transform="rotate(-28 128 128)"><rect x="70" y="116" width="120" height="24" rx="6"/><rect x="186" y="106" width="18" height="44" rx="5"/><rect x="44" y="100" width="38" height="56" rx="12"/></g><circle cx="196" cy="86" r="8" fill="#62D2E0" stroke="none"/><path d="M196 70 v-12 M210 80 l9 -8 M212 96 l13 2" stroke="#62D2E0" stroke-width="6"/></svg>`,
  Comms:`<svg viewBox="0 0 256 256" fill="none" stroke="#E8EAED" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"><line x1="96" y1="206" x2="96" y2="96"/><line x1="72" y1="206" x2="120" y2="206"/><circle cx="96" cy="92" r="9" fill="#E8EAED" stroke="none"/><path d="M115 115 A30 30 0 0 1 115 69" stroke="#8A9099" stroke-width="7"/><path d="M127 129 A48 48 0 0 1 127 55"/><path d="M138 143 A66 66 0 0 1 138 41" stroke="#62D2E0"/></svg>`
};
const slots = {Ketten:"Mobilität",Core:"Defense",Turm:"Reaktion",["Geschütz"]:"Firepower",Comms:"Information"};
function build(target,active){
  const g=document.getElementById(target);
  for(const [name,svg] of Object.entries(icons)){
    g.insertAdjacentHTML("beforeend",
      `<div class="card${active?' active':''}"><div class="ico">${svg}</div><div class="name">${name}</div><div class="slot">${slots[name]}</div></div>`);
  }
}
build("grid",false); build("gridActive",true);
const toks={"--bg-base":"#0E0F11","--bg-panel":"#15171A","--ink":"#E8EAED","--ink-muted":"#8A9099","--accent":"#62D2E0","--danger":"#E0556A"};
const sw=document.getElementById("sw");
for(const [k,v] of Object.entries(toks)){
  sw.insertAdjacentHTML("beforeend",`<div class="sw"><div class="chip" style="background:${v}"></div>${k}<br>${v}</div>`);
}
</script>
</body>
</html>
